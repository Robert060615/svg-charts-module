plugins {
    // Shared convention plugins for the Java toolchain, static analysis, and test lifecycle.
    id 'lnu.java-conventions'
    id 'lnu.quality-conventions'
    id 'lnu.testing-conventions'

    // Packages and runs the test app as a CLI application.
    id 'application'
}

group = 'se.lnu.rm222xi'
version = '1.0.0'

application {
    mainClass = 'se.lnu.rm222xi.demo.App'
}

dependencies {
    implementation project(':lib')
}
